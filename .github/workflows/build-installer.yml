name: Build Windows Installer Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-desktop-installer
      - 'release/**'

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.7'

      - name: Install pinned application dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-legacy.txt
          python -m pip install -r requirements-core-test.txt -c constraints-legacy.txt
          python -m pip install --no-cache-dir -r requirements-runtime-windows.txt -c constraints-legacy.txt
      - name: Fetch and verify pretrained models
        run: python fetch_pretrained_models.py
      - name: Backend and released-model regressions
        run: python -m pytest -q tests/testcases
      - name: Acceptance harness regressions
        run: python -m unittest discover -s tests/acceptance -p "test_*.py" -v
      - name: Browser-side regression tests
        shell: pwsh
        run: |
          Get-ChildItem tests/testcases_js/test_*.js | Sort-Object Name | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Browser regression failed: $($_.Name)" }
          }
      - name: Build complete installed payload
        run: python build.py --installer-payload
      - name: Compile per-user installer
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $compiler) {
            $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
            $compiler = Get-ChildItem -Path $programFilesX86 -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $compiler) { throw 'Inno Setup ISCC.exe is not available on this runner.' }
          $compilerPath = if ($compiler.FullName) { $compiler.FullName } else { $compiler.Source }
          & $compilerPath "/DAppVersion=0.0.0-dev.${{ github.run_number }}" packaging/windows/RootDetector.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Record installer checksum
        shell: pwsh
        run: |
          $artifact = Get-Item builds/RootDetector-Windows-Setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content builds/RootDetector-Windows-Setup.sha256
      - name: Silent install and uninstall smoke
        shell: pwsh
        run: |
          $installer = (Resolve-Path builds/RootDetector-Windows-Setup.exe).Path
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\RootDetector'
          $data = Join-Path $env:LOCALAPPDATA 'RootDetector'
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $application = Join-Path $installed 'main\main.exe'
          if (-not (Test-Path $application)) { throw 'Installed application is missing.' }
          $models = Join-Path $data 'models'
          & $application --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Installed application failed startup: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $data 'static\index.html'))) { throw 'Installed browser assets are missing.' }
          if (-not (Test-Path (Join-Path $data 'BUILD-INFO.txt'))) { throw 'Build provenance was not retained.' }
          $applicationProcess = Start-Process -FilePath $application -WorkingDirectory $env:TEMP -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 300; $attempt++) {
              $applicationProcess.Refresh()
              if ($applicationProcess.HasExited) { throw "Installed app exited before readiness: $($applicationProcess.ExitCode)" }
              try {
                $session = Invoke-RestMethod -Uri 'http://127.0.0.1:5000/api/session' -TimeoutSec 2
                if ($session.asset_schema -and $session.token) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Installed app did not become ready within 300 seconds.' }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:5000/' -UseBasicParsing -TimeoutSec 10
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'RootDetector') {
              throw 'Installed browser UI did not load.'
            }
            $modelPaths = @()
            Get-Content (Join-Path $installed 'models\pretrained_models.txt') | ForEach-Object {
              if (-not $_.Trim() -or $_.Trim().StartsWith('#')) { return }
              $entry = $_ -split ' : '
              if ($entry.Count -ne 3) { throw 'Packaged model manifest lacks SHA-256.' }
              $modelPath = Join-Path $models $entry[0]
              if (-not (Test-Path $modelPath)) { throw "First launch did not download $($entry[0])." }
              $hash = (Get-FileHash -Algorithm SHA256 $modelPath).Hash.ToLowerInvariant()
              if ($hash -ne $entry[2].ToLowerInvariant()) { throw "First-launch model checksum mismatch: $($entry[0])." }
              $modelPaths += $modelPath
            }
            if ($modelPaths.Count -ne 5) { throw 'Unexpected number of verified first-launch models.' }
            $blockedUpgrade = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
            if (-not $blockedUpgrade.WaitForExit(30000)) {
              Stop-Process -Id $blockedUpgrade.Id -Force
              throw 'Installer did not refuse an upgrade while analysis could be running.'
            }
            if ($blockedUpgrade.ExitCode -eq 0 -or $applicationProcess.HasExited) {
              throw 'Installer changed the running application instead of refusing the upgrade.'
            }
            $stillReady = Invoke-RestMethod -Uri 'http://127.0.0.1:5000/api/session' -TimeoutSec 10
            if (-not $stillReady.asset_schema) { throw 'Blocked upgrade interrupted the running application.' }
          } finally {
            if (-not $applicationProcess.HasExited) { Stop-Process -Id $applicationProcess.Id -Force }
            $applicationProcess.WaitForExit()
          }
          $obsoleteRuntimeFile = Join-Path $installed 'main\torch\lib\obsolete-runtime-test.dll'
          'obsolete runtime test fixture' | Set-Content $obsoleteRuntimeFile
          $upgrade = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade after shutdown failed: $($upgrade.ExitCode)" }
          if (Test-Path $obsoleteRuntimeFile) { throw 'Upgrade retained obsolete runtime libraries.' }
          & $application --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Upgraded runtime failed integrity/startup check.' }
          if (-not (Test-Path $modelPaths[0])) { throw 'Upgrade removed downloaded user models.' }
          $uninstaller = Get-ChildItem -Path $installed -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller is missing.' }
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
          for ($attempt = 0; $attempt -lt 30 -and (Test-Path $application); $attempt++) { Start-Sleep -Seconds 1 }
          if (Test-Path $application) { throw 'Uninstall left the application executable behind.' }
          if (-not (Test-Path $modelPaths[0])) { throw 'Uninstall removed downloaded user models.' }
      - uses: actions/upload-artifact@v6
        with:
          name: RootDetector-Windows-installer-preview
          path: |
            builds/RootDetector-Windows-Setup.exe
            builds/RootDetector-Windows-Setup.sha256
          if-no-files-found: error
