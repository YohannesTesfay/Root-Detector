name: Build Windows Installer Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-desktop-installer

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.7'

      - name: Install pinned application dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-legacy.txt
          python -m pip install -r requirements-core-test.txt -c constraints-legacy.txt
      - name: Fetch and verify pretrained models
        run: python fetch_pretrained_models.py
      - name: Installed-path and runtime tests
        run: python -m pytest -q tests/testcases/test_desktop_paths.py tests/testcases/test_startup.py
      - name: Browser-side regression tests
        run: |
          node tests/testcases_js/test_upload_reliability_node.js
          node tests/testcases_js/test_pipeline_upload_isolation.js
          node tests/testcases_js/test_tracking_utils.js
          node tests/testcases_js/test_training_labels.js
      - name: Build complete installed payload
        run: python build.py --installer-payload
      - name: Compile per-user installer
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $compiler) {
            $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
            $compiler = Get-ChildItem -Path $programFilesX86 -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $compiler) { throw 'Inno Setup ISCC.exe is not available on this runner.' }
          $compilerPath = if ($compiler.FullName) { $compiler.FullName } else { $compiler.Source }
          & $compilerPath "/DAppVersion=0.0.0-dev.${{ github.run_number }}" packaging/windows/RootDetector.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Record installer checksum
        shell: pwsh
        run: |
          $artifact = Get-Item builds/RootDetector-Windows-Setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content builds/RootDetector-Windows-Setup.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: RootDetector-Windows-installer-preview
          path: |
            builds/RootDetector-Windows-Setup.exe
            builds/RootDetector-Windows-Setup.sha256
          if-no-files-found: error
