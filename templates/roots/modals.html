
{% macro modal_settings() %}
<!-- Settings -->
<div class="ui tiny modal" id="settings-dialog">
    <i class="close icon"></i>
    <div class="header"> Settings </div>
  
    <div class="ui form content">
      
      <div class="field">
        <label>Root detection model</label>
        <div class="ui dropdown selection" id="settings-active-model">
          <input type="hidden" name="active-model">
          <i class="dropdown icon"></i>
          <div class="default text">Segmentation model</div>
          <div class="menu">
            <!--<div class="item" data-value="1">model_1</div>
            <div class="item" data-value="0">model_2</div>-->
          </div>
        </div>
      </div>
  
      <div class="ui divider"></div>
      <div class="field">
        <label>Exclusion mask</label>
        <div class="ui toggle checkbox" id="settings-exclusionmask-enable">
          <input type="checkbox">
          <label>Enable detection of foreign objects (e.g. tape)</label>
        </div>
      </div>
  
      <div class="field" id="settings-exclusionmask-model-field" style="display:none">
        <label>Exclusion mask model</label>
        <div class="ui dropdown selection" id="settings-exclusionmask-model">
          <input type="hidden" name="active-model">
          <i class="dropdown icon"></i>
          <div class="default text">Exclusion mask model</div>
          <div class="menu">
            <!--<div class="item" data-value="1">model_1</div>
            <div class="item" data-value="0">model_2</div>-->
          </div>
        </div>
      </div>
  
      <div class="ui divider"></div>
      <div class="field" id="settings-tracking-model-field">
        <label>Root tracking model</label>
        <div class="ui dropdown selection" id="settings-tracking-model">
          <input type="hidden" name="active-model">
          <i class="dropdown icon"></i>
          <div class="default text">Root tracking model</div>
          <div class="menu">
            <!--<div class="item" data-value="1">model_1</div>
            <div class="item" data-value="0">model_2</div>-->
          </div>
        </div>
      </div>

      <div class="field">
        <label></label>
        <div class="ui right labeled input" id="settings-too-many-roots">
          <input type="number" step="10000" min="10000" style="width: 5ch;" value="100000" id='settings-too-many-roots-input'>
          <div class="ui basic label" style="width:10%;"> px </div>
          <label style="padding:10px; width:70%;">Skip processing if too many roots detected</label>
        </div>
      </div>


      <div class="ui divider"></div>
      <div class="field" id="settings-gpu-field">
        <label>GPU</label>
        <div class="ui visible warning message"  id="settings-no-gpu-warning">
          <p>GPU not available</p>
        </div>
        <div id="settings-gpu-available-box">
          <div class="ui message" id="settings-gpu-name-info">
            <p>Available GPU: <span id="settings-gpu-name">XXX</span></p>
          </div>
          <div class="ui toggle checkbox" id="settings-gpu-enable">
            <input type="checkbox">
            <label>Enable processing on the GPU</label>
          </div>
        </div>
      </div>

      <div class="ui divider"></div>

  
     <div class="actions">
        <div class="ui negative button">
          Cancel
        </div>
        <div class="ui positive right labeled icon button" id="settings-ok-button">
          Save
          <i class="checkmark icon"></i>
        </div>
      </div>
    </div>
</div>
{% endmacro %}


{% macro modal_pipeline() %}
<div class="ui large modal" id="pipeline-status-modal">
  <div class="header">Analysis Progress</div>
  <div class="content">
    <div class="ui progress" id="pipeline-progress">
      <div class="bar"><div class="progress"></div></div>
    </div>
    <p id="pipeline-current-message">Preparing analysis...</p>
    <div class="ui negative message" id="pipeline-error-message" style="display:none"></div>
    <div style="max-height:45vh; overflow:auto;">
      <table class="ui compact celled table" id="pipeline-status-table">
        <thead>
          <tr><th>Image or pair</th><th>Stage</th><th>Status</th><th>Details</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <div class="actions">
    <button class="ui negative button" id="pipeline-cancel-button" onclick="RootPipeline.on_cancel()">Cancel</button>
    <button class="ui button" id="pipeline-retry-button" onclick="RootPipeline.on_retry_failed()" style="display:none">Retry failed</button>
    <button class="ui positive button" id="pipeline-close-button" style="display:none">Close</button>
  </div>
</div>
{% endmacro %}
